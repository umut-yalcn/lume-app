name: Release Lume binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Upload Release Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Go tests
        env:
          CGO_ENABLED: 1
        run: |
          cd "go version lume"
          go vet ./...
          go test -race ./...
          cd "../cli version lume"
          go vet ./...
          go test -race ./...

      - name: Run Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "python version lume\requirements.txt"
          cd "python version lume"
          python -m unittest discover -p "test_*.py" -v

      - name: Build Python GUI version
        run: |
          python -m pip install pyinstaller
          cd "python version lume"
          pyinstaller --noconfirm --onefile --windowed --name lume_python_gui --icon lume.ico --manifest main.manifest --add-data "lume.png;." --add-data "lume.ico;." main.py

      - name: Resolve version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Go GUI version
        run: |
          cd "go version lume"
          go build -ldflags="-H windowsgui -X main.AppVersion=${{ steps.version.outputs.value }}" -o lume_go_gui.exe .

      - name: Build CLI version
        run: |
          cd "cli version lume"
          go build -ldflags="-X main.AppVersion=${{ steps.version.outputs.value }}-CLI" -o lume_go_cli.exe .

      - name: Remove old release assets
        uses: actions/github-script@v7
        with:
          script: |
            const namesToRemove = new Set([
              'Lume.exe',
              'Lume_Pro.exe',
              'lume.cli.version.compact.exe',
              'Lume_Python_GUI.exe',
              'Lume_Go_GUI.exe',
              'Lume_Go_CLI.exe',
              'lume_python_gui.exe',
              'lume_go_gui.exe',
              'lume_go_cli.exe',
            ]);

            const tag = context.ref.replace('refs/tags/', '');

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing release for ${tag}; nothing to clean up.`);
                return;
              }
              throw error;
            }

            for (const asset of release.data.assets) {
              if (!namesToRemove.has(asset.name)) {
                continue;
              }

              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

      - name: Extract release notes from tag
        id: notes
        shell: bash
        run: |
          git fetch --force --tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo "body<<LUME_RELEASE_NOTES"
            git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}"
            echo "LUME_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            python version lume/dist/lume_python_gui.exe
            go version lume/lume_go_gui.exe
            cli version lume/lume_go_cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
